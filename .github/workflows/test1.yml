name: CAP CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install CDS DK
        run: npm install -g @sap/cds-dk

      - name: Build CAP project
        run: cds build

      - name: Verify model
        run: cds compile srv/
